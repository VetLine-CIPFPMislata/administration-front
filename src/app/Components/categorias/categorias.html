<div>
    <button routerLink="/nuevo/category">Dar de alta</button>
    <input
        type="search"
        placeholder="Buscar por nombre o ID"
        aria-label="Buscar categorías"
        (input)="onSearch($event.target.value)"
    />
</div>

<table>
    <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (categoria of filteredCategorias; track categoria.id) {
        <tr>
            <td>{{ categoria.id }}</td>
            <td>{{ categoria.name }}</td>
            <td>
                <button (click)="openDeleteModal(categoria)">Borrar</button>
            </td>
        </tr>
        }

        @if (filteredCategorias.length == 0) {
        <tr>
            <td colspan="3">No hay categorías.</td>
        </tr>
        }
    </tbody>
</table>

@if (modal) {
<div class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-content">
        <h3>Confirmar borrado</h3>
        @if (borrarCategoria) {
        <p>¿Deseas borrar la categoría "{{ borrarCategoria.name }}"?</p>
        
        <div class="modal-actions">
            <button (click)="close()">Cancelar</button>
            <button (click)="borrar(borrarCategoria.id)">Borrar</button>
        </div>
    }
    </div>
</div>
}
