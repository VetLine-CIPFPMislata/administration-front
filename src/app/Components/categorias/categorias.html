<div class="categories">
  <div class="categories__header">
    <h1 class="categories__title">Gestión de Categorías</h1>
    <div class="categories__controls">
      <input
        class="categories__search"
        type="search"
        placeholder="Buscar por nombre o ID"
        aria-label="Buscar categorías"
        (input)="onSearch($event.target.value)"
      />
      <a routerLink="/nuevo/category" class="categories__btn categories__btn--nuevo">
        Nueva categoría
      </a>
    </div>
  </div>

  <table class="categories__table">
    <thead class="categories__table-head">
      <tr class="categories__table-row">
        <th class="categories__table-header categories__table-header--left">Id</th>
        <th class="categories__table-header categories__table-header--left">Nombre</th>
        <th class="categories__table-header"></th>
      </tr>
    </thead>
    <tbody class="categories__table-body">
      @for (categoria of filteredCategorias; track categoria.id) {
        <tr class="categories__table-row">
          <td class="categories__table-cell categories__table-cell--left">{{ categoria.id }}</td>
          <td class="categories__table-cell categories__table-cell--name" routerLink="{{categoria.id}}">{{ categoria.name }}</td>
          <td class="categories__table-cell categories__table-cell--actions">
            <mat-icon
              class="categories__delete-btn"
              (click)="openDeleteModal(categoria)">
              delete
            </mat-icon>
          </td>
        </tr>
      }

      @if (filteredCategorias.length == 0) {
        <tr class="categories__table-row">
          <td class="categories__table-cell" colspan="3">
            No hay categorías.
          </td>
        </tr>
      }
    </tbody>
  </table>

  @if (modal) {
    <div class="categories__overlay" role="dialog" aria-modal="true">
      <div class="categories__modal">
        <h3 class="categories__modal-title">Confirmar borrado</h3>

        @if (borrarCategoria) {

          <div class="categories__modal-actions">
            <button
              class="categories__modal-btn categories__modal-btn--cancel"
              (click)="close()">
              Cancelar
            </button>

            <button
              class="categories__modal-btn categories__modal-btn--delete"
              (click)="borrar(borrarCategoria.id)">
              Borrar
            </button>
          </div>
        }
      </div>
    </div>
  }

</div>
